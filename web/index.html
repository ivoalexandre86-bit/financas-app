<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestão financeira pessoal com projeção mensal, cartões, recorrências e parcelamentos.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Finanças</title>
  <link rel="manifest" href="manifest.json">

  <!-- Inicialização mais rápida: baixa o app em paralelo com o motor
       gráfico e já abre a conexão com o servidor e as fontes. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://financas-api-wfx8.onrender.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #f5f6f8; }
    @media (prefers-color-scheme: dark) { html, body { background: #111318; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #2457d6; transition: opacity .25s;
    }
    #splash img { width: 72px; height: 72px; border-radius: 18px; }
    #splash .name { font-size: 20px; font-weight: 600; }
    #splash .bar { width: 160px; height: 4px; border-radius: 2px;
      background: rgba(36,87,214,.15); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%;
      background: #2457d6; border-radius: 2px; animation: load 1.1s ease-in-out infinite; }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Finanças</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
